<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>سجل التلاميذ — أستاذ أحمد</title>
<style>
:root{--bg:#10131b;--card:#1a2030;--bd:#2b3347;--tx:#eef1f8;--mu:#9aa3b8;--ac:#5aa9ff;--ok:#2fbf71;--no:#ff6b6b;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f1f4fa;--card:#fff;--bd:#d5dbe9;--tx:#161b2a;--mu:#5d6781;color-scheme:light}}
:root[data-theme="dark"]{--bg:#10131b;--card:#1a2030;--bd:#2b3347;--tx:#eef1f8;--mu:#9aa3b8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",Arial,sans-serif;padding:14px;max-width:640px;margin-inline:auto}
.hd{background:linear-gradient(120deg,#6c4bff,#00b3ff);color:#fff;border-radius:20px;padding:16px 18px;font-size:22px;font-weight:700;margin-bottom:12px}
.sub{font-size:12px;color:var(--mu);margin:4px 2px 10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
.tile{border:0;border-radius:20px;padding:22px 8px;font:inherit;font-size:18px;color:#1c2233;cursor:pointer;text-align:center;min-height:110px}
.tile b{display:block;font-size:32px;margin-bottom:6px}.tile small{display:block;font-size:13px;opacity:.75;margin-top:4px}
.t1{background:linear-gradient(135deg,#ffd1dc,#ff9aa2)}.t2{background:linear-gradient(135deg,#cfeeff,#82c4ff)}.t3{background:linear-gradient(135deg,#d3f9c2,#8fe07a)}.t4{background:linear-gradient(135deg,#e3d6ff,#b69cff)}.t5{background:linear-gradient(135deg,#ffe8a8,#ffc55c)}.t6{background:linear-gradient(135deg,#c6f3e3,#6fd8b3)}.t7{background:linear-gradient(135deg,#ffd9bd,#ffa07a)}.t8{background:linear-gradient(135deg,#dbe3ee,#a9b9d1)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.chip,.btn{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:14px;padding:10px 14px;font:inherit;cursor:pointer}
.chip.on{background:var(--ac);color:#06223f;border-color:var(--ac);font-weight:700}
.btn.pri{background:var(--ac);color:#06223f;border-color:var(--ac);font-weight:700}
input,textarea,select{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:14px;padding:12px;font:inherit;width:100%}
.in{flex:1;min-width:120px}
.item{background:var(--card);border:1px solid var(--bd);border-inline-start:6px solid var(--ac);border-radius:16px;padding:12px 14px;margin:8px 0;display:flex;align-items:center;justify-content:space-between;gap:8px}
.st{border:2px solid;border-radius:12px;padding:8px 16px;font:inherit;cursor:pointer;background:transparent}
.st.p{color:var(--ok);border-color:var(--ok)}.st.a{color:var(--no);border-color:var(--no)}
.x{background:none;border:1px solid var(--bd);color:var(--mu);border-radius:50%;width:34px;height:34px;cursor:pointer}
.sec{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:14px;text-align:center;cursor:pointer;color:var(--tx);font:inherit}
.sec.on{outline:3px solid var(--ac)}
.note{font-size:13px;color:var(--mu)}
#auth{position:fixed;inset:0;background:var(--bg);z-index:9;padding:20px;display:none;flex-direction:column;justify-content:center;gap:10px;max-width:420px;margin:auto}
#auth.on{display:flex}#msg{color:var(--no);font-size:14px;min-height:20px}
.tbl{overflow:auto;max-height:68vh;margin-top:10px;border:1px solid var(--bd);border-radius:14px}
table{border-collapse:separate;border-spacing:0;min-width:100%}th,td{border-bottom:1px solid var(--bd);border-left:1px solid var(--bd);padding:6px;text-align:center;white-space:nowrap;background:var(--card)}
th{background:#4d6dff;color:#fff;position:sticky;top:0;z-index:2}th.nm,td.nm{position:sticky;right:0;z-index:3;text-align:right;min-width:150px}th.nm{z-index:4}td.nm{box-shadow:-2px 0 4px rgba(0,0,0,.25)}
.lvsel{border:0;border-radius:10px;padding:10px 6px;font:inherit;min-width:92px;text-align:center;background:var(--card);color:var(--mu)}
.l1{background:#f5b7b7;color:#1c2233}.l2{background:#f7d9c4;color:#1c2233}.l3{background:#fbf0b0;color:#1c2233}.l4{background:#c3ebc9;color:#1c2233}.l5{background:#b5dff0;color:#1c2233}.l6{background:#c9b8f5;color:#1c2233}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px;text-align:center}.stat b{display:block;font-size:30px;color:var(--ac)}.stat span{font-size:13px;color:var(--mu)}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:8;display:none;align-items:flex-end}#sheet.on{display:flex}
#sheet .box{background:var(--card);width:100%;max-width:640px;margin:auto;border-radius:24px 24px 0 0;padding:18px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}
.lvb{border:0;border-radius:16px;padding:22px 8px;font:inherit;font-size:20px;font-weight:700;cursor:pointer;color:#1c2233}.lvsel{cursor:pointer}
.tsel{border:1px solid var(--bd);border-radius:10px;padding:8px 4px;font:inherit;background:var(--card);color:var(--tx);width:118px;text-align:center}
th.t2{background:#1fa37a}th.t3{background:#d98a1f}td.c{font-weight:700}
.mk{width:64px;text-align:center;padding:8px 2px;border-radius:8px}
td.low,td.low input{background:#ff6b6b;color:#fff}
th.sn,td.sn{position:sticky;right:0;z-index:3;min-width:38px}th.sn{z-index:4}
th.nm2,td.nm2{position:sticky;right:38px;z-index:3;text-align:right;min-width:150px}th.nm2{z-index:4}td.nm2{box-shadow:-2px 0 4px rgba(0,0,0,.25)}
</style>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#6c4bff"><link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>
<div id="auth"><div class="hd">📒 سجل التلاميذ</div>
<input id="aem" type="email" placeholder="البريد الإلكتروني" autocomplete="email" dir="ltr">
<input id="apw" type="password" placeholder="كلمة المرور (6 أحرف أو أكثر)" autocomplete="current-password" dir="ltr">
<div id="msg"></div>
<button class="btn pri" id="li">تسجيل الدخول</button><button class="btn" id="su">إنشاء حساب جديد</button><button class="btn" id="fp">نسيت كلمة المرور</button></div>
<div id="app"></div>
<div id="sheet"><div class="box"><b id="shn" style="font-size:22px"></b><div id="shs" class="note" style="margin:6px 0 14px"></div><div class="grid" id="shg" style="margin:0 0 12px;gap:10px"></div><div class="row"><button class="btn" id="shc" style="flex:1">مسح التقييم</button><button class="btn" id="shk" style="flex:1">تخطّ</button><button class="btn pri" id="shx" style="flex:1">إغلاق</button></div></div></div>
<script>
const $=s=>document.querySelector(s);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const today=()=>new Date().toISOString().slice(0,10);
const DEF=()=>({classes:[{id:'c1',name:'الصف الرابع',sections:[{id:'s1',name:'شعبة أ',students:[]},{id:'s2',name:'شعبة ب',students:[]}]}],att:{},gr:{},tt:{},lp:{},ev:{},evs:{},mk:{},email:'',cur:{c:'c1',s:'s1'}});
let S=DEF(),KEY='reg_v1',unsub=null;
const SUBJ=['القراءة','القواعد','المحفوظات','التعبير','الإملاء'];
const ALL=[...SUBJ,'الرياضيات','العلوم','التربية الإسلامية','الاجتماعيات','التربية الفنية','التربية الرياضية','الإنكليزية'];
const MON=['تشرين الأول','تشرين الثاني','كانون الأول','كانون الثاني','شباط','آذار','نيسان','أيار'];
const DAYS=['السبت','الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس'];
let gs=SUBJ[0],gm=MON[0],rsAll=false,evSort='alpha';
function ensure(){S.gr=S.gr||{};S.tt=S.tt||{};S.lp=S.lp||{};S.ev=S.ev||{};S.evs=S.evs||{};S.mk=S.mk||{}}
const LV=['ضعيف','مقبول','متوسط','جيد','جيد جدا','ممتاز'];
let view='home',date=today(),adding=null,sync='⏳',ref=null,lastJson='',timer=null,pend=0;

function syncText(){if(!navigator.onLine)return '📴 بدون إنترنت — محفوظ على الجهاز وسيُرفع عند عودة الاتصال';if(pend>0)return '⏳ جارٍ المزامنة…';return sync}
function save(){
  const j=JSON.stringify(S),t=Date.now();lastJson=j;
  try{localStorage.setItem(KEY,j);localStorage.setItem(KEY+'_t',String(t))}catch(e){}
  clearTimeout(timer);
  timer=setTimeout(async()=>{
    if(!ref)return;
    if(!navigator.onLine){sync='📴 بدون إنترنت — محفوظ على الجهاز وسيُرفع عند عودة الاتصال';if(view==='home')render()}
    pend++;try{await ref.set({json:j,t});sync='✅ تمت المزامنة'}catch(e){sync='⚠️ تعذرت المزامنة'}pend=Math.max(0,pend-1);
    if(view==='home')render();
  },600);
}
function load(j){try{const d=JSON.parse(j);if(d&&d.classes){S=d;return true}}catch(e){}return false}
function cls(){return S.classes.find(c=>c.id===S.cur.c)||S.classes[0]}
function sec(){const c=cls();return c&&(c.sections.find(s=>s.id===S.cur.s)||c.sections[0])}
function go(v){view=v;adding=null;render()}

function pct(s){const k=date+'|'+s.id,a=S.att[k]||{};const n=s.students.length;if(!n)return 0;return Math.round(100*(n-Object.keys(a).length)/n)}

function render(){
  const A=$('#app');ensure();
  if(view==='home'){
    const c=cls();
    A.innerHTML=`<div class="hd">📒 سجل التلاميذ — أستاذ أحمد</div>
    <div class="sub">${esc(syncText())}</div>
    <div class="row">${S.classes.map(x=>`<button class="chip ${x.id===c.id?'on':''}" data-c="${x.id}">${esc(x.name)}</button>`).join('')}<button class="btn pri" id="addC">＋ إضافة صف</button></div>
    ${adding==='c'?`<div class="row"><input class="in" id="nm" placeholder="اسم الصف الجديد"><button class="btn pri" id="ok">حفظ</button></div>`:''}
    <div class="grid">${c.sections.map((s,i)=>`<button class="sec ${s.id===sec().id?'on':''}" data-s="${s.id}"><div style="font-size:30px">👥</div><div style="font-size:18px;font-weight:700">${esc(s.name)}</div><div class="note">${s.students.length} تلميذ · ${pct(s)}%</div></button>`).join('')}
    <button class="tile t5" id="addS" style="min-height:0"><b>＋</b>إضافة شعبة</button></div>
    ${adding==='s'?`<div class="row"><input class="in" id="nm" placeholder="اسم الشعبة (مثل: شعبة ج)"><button class="btn pri" id="ok">حفظ</button></div>`:''}
    <div class="note">المحددة الآن: ${esc(c.name)} — ${esc(sec().name)}</div>
    <div class="row"><button class="btn" id="rs">✏️ تعديل اسم الشعبة</button><button class="btn" id="ds">🗑 حذف الشعبة</button><button class="btn" id="rc">✏️ اسم الصف</button><button class="btn" id="dc">🗑 حذف الصف</button></div>
    <div class="grid">
      <button class="tile t3" data-v="att"><b>✅</b>تحضير التلاميذ</button>
      <button class="tile t4" data-v="stu"><b>📋</b>سجل التلاميذ</button>
      <button class="tile t3" data-v="ev"><b>⭐</b>التقييمات</button>
      <button class="tile t1" data-v="gr"><b>📝</b>الدرجات</button>
      <button class="tile t5" data-v="tt"><b>🗓️</b>الجدول الأسبوعي</button>
      <button class="tile t2" data-v="lp"><b>📚</b>تحضير الدروس</button>
      <button class="tile t6" data-v="res"><b>📊</b>النتائج<small>ترتيب تلقائي</small></button>
      <button class="tile t7" data-v="bak"><b>💾</b>النسخة الاحتياطية<small>حفظ واستعادة</small></button>
      <button class="tile t8" data-v="set"><b>⚙️</b>الإعدادات</button>
    </div>`;
    A.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{S.cur.c=b.dataset.c;S.cur.s=cls().sections[0].id;save();render()});
    A.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{S.cur.s=b.dataset.s;save();render()});
    A.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>go(b.dataset.v));
    $('#addC').onclick=()=>{adding='c';render();$('#nm').focus()};
    $('#rs').onclick=()=>{const sx=sec(),v=(prompt('اسم الشعبة الجديد',sx.name)||'').trim();if(!v||v===sx.name)return;if(c.sections.some(x=>x.name===v)){alert('هذه الشعبة موجودة');return}sx.name=v;save();render()};
    $('#ds').onclick=()=>{const sx=sec();if(c.sections.length<2){alert('لا يمكن حذف الشعبة الوحيدة في الصف');return}if(!confirm('حذف «'+sx.name+'» وكل بياناتها ('+sx.students.length+' تلميذ)؟ لا يمكن التراجع.'))return;dropSection(sx);c.sections=c.sections.filter(x=>x.id!==sx.id);S.cur.s=c.sections[0].id;save();render()};
    $('#rc').onclick=()=>{const v=(prompt('اسم الصف الجديد',c.name)||'').trim();if(!v||v===c.name)return;c.name=v;save();render()};
    $('#dc').onclick=()=>{if(S.classes.length<2){alert('لا يمكن حذف الصف الوحيد');return}if(!confirm('حذف «'+c.name+'» وكل شعبه وتلاميذه؟ لا يمكن التراجع.'))return;c.sections.forEach(dropSection);delete S.evs[c.id];S.classes=S.classes.filter(x=>x.id!==c.id);S.cur={c:S.classes[0].id,s:S.classes[0].sections[0].id};save();render()};
    $('#addS').onclick=()=>{adding='s';render();$('#nm').focus()};
    if($('#ok'))$('#ok').onclick=()=>{
      const v=$('#nm').value.trim();if(!v)return;
      if(adding==='c'){const id='c'+uid();S.classes.push({id,name:v,sections:[{id:'s'+uid(),name:'شعبة أ',students:[]}]});S.cur={c:id,s:S.classes.at(-1).sections[0].id}}
      else{if(c.sections.some(s=>s.name===v)){alert('هذه الشعبة موجودة');return}const id='s'+uid();c.sections.push({id,name:v,students:[]});S.cur.s=id}
      adding=null;save();render();
    };
    return;
  }
  const c=cls(),s=sec();
  const back=`<button class="btn" id="back">→ الرئيسية</button>`;
  const pick=`<div class="row"><select id="pc">${S.classes.map(x=>`<option value="${x.id}" ${x.id===c.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select><select id="ps">${c.sections.map(x=>`<option value="${x.id}" ${x.id===s.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div>`;
  let h='';
  if(view==='att'){
    const k=date+'|'+s.id,a=S.att[k]||{};
    h=`${back}<div class="hd">تحضير التلاميذ</div>${pick}<input type="date" id="dt" value="${date}">
    <div class="note">حاضر ${s.students.length-Object.keys(a).length} · غائب ${Object.keys(a).length}</div>
    ${s.students.map(t=>{const ab=!!a[t.id];return `<div class="item"><b>${esc(t.name)}</b><button class="st ${ab?'a':'p'}" data-t="${t.id}">${ab?'غائب':'حاضر'}</button></div>`}).join('')||'<p class="note">لا يوجد تلاميذ — أضفهم من «سجل التلاميذ».</p>'}`;
  }else if(view==='stu'){
    h=`${back}<div class="hd">سجل التلاميذ</div>${secChips(c,s)}
    <div class="row"><input class="in" id="nm" placeholder="اسم تلميذ جديد"><button class="btn" id="mic">🎤</button><button class="btn pri" id="add">إضافة</button></div>
    <textarea id="bulk" rows="3" placeholder="أو الصق عدة أسماء، كل اسم في سطر"></textarea>
    <div class="row"><button class="btn" id="addb">إضافة الأسماء</button></div>
    ${isUpper(c)?markBlock(c,s):evBlock(c,s)}`;
  }else if(view==='ev'){
    h=`${back}<div class="hd">⭐ التقييمات</div>${pick}${evBlock(c,s)}`;
  }else if(view==='gr'){
    const vals=t=>Object.values((S.gr[s.id]||{})[gs]||{}).map(x=>x[t.id]).filter(v=>v!==undefined&&v!=='');
    h=`${back}<div class="hd">📝 الدرجات</div>${pick}
    <div class="row"><select id="gs">${SUBJ.map(o=>`<option ${o===gs?'selected':''}>${o}</option>`).join('')}</select><select id="gm">${MON.map(o=>`<option ${o===gm?'selected':''}>${o}</option>`).join('')}</select></div>
    <div class="note">أدخل الدرجة من 100 لكل تلميذ، والمعدل يُحسب من الأشهر المدخلة.</div>
    ${[...s.students].sort((x,y)=>x.name.localeCompare(y.name,'ar')).map(t=>{const v=((((S.gr[s.id]||{})[gs]||{})[gm])||{})[t.id];const a=vals(t);const avg=a.length?(a.reduce((x,y)=>x+ +y,0)/a.length).toFixed(1):'—';return `<div class="item"><span>${esc(t.name)}<div class="note">المعدل: ${avg}</div></span><input type="number" min="0" max="100" inputmode="decimal" style="width:90px" data-g="${t.id}" value="${v===undefined?'':v}"></div>`}).join('')||'<p class="note">أضف التلاميذ أولًا من «سجل التلاميذ».</p>'}`;
  }else if(view==='tt'){
    h=`${back}<div class="hd">🗓️ الجدول الأسبوعي</div>${pick}
    <div class="tbl"><table><tr><th class="nm" style="min-width:80px">اليوم</th>${[1,2,3,4,5,6].map(i=>`<th>الحصة ${i}</th>`).join('')}</tr>
    ${DAYS.map(d=>{const row=((S.tt[s.id]||{})[d])||[];return `<tr><td class="nm" style="min-width:80px;font-weight:700;text-align:center">${d}</td>${[0,1,2,3,4,5].map(i=>`<td><input class="tsel" data-tt="${d}|${i}" value="${esc(row[i]||'')}" placeholder="—"></td>`).join('')}</tr>`}).join('')}</table></div>`;
  }else if(view==='lp'){
    const L=S.lp[s.id]||[];
    h=`${back}<div class="hd">📚 تحضير الدروس</div>${pick}
    <div class="row"><input type="date" id="lpd" value="${today()}" class="in"><select id="lps" class="in">${SUBJ.map(o=>`<option>${o}</option>`).join('')}</select></div>
    <input id="lpt" placeholder="عنوان الدرس"><textarea id="lpn" rows="3" placeholder="ملاحظات / أهداف الدرس" style="margin-top:8px"></textarea>
    <div class="row"><button class="btn pri" id="lpa">إضافة</button></div>
    ${L.map(x=>`<div class="item"><span><b>${esc(x.t)}</b><div class="note">${esc(x.s)} · ${esc(x.d)}</div>${x.n?`<div class="note">${esc(x.n)}</div>`:''}</span><button class="x" data-lp="${x.id}">✕</button></div>`).join('')||'<p class="note">لا توجد سجلات بعد.</p>'}`;
  }else if(view==='res'){
    const R=rank(scope());const any=R.some(r=>r.avg>0);
    h=`${back}<div class="hd">📊 النتائج</div>${pick}
    <div class="row"><button class="chip ${rsAll?'':'on'}" id="r1">${esc(s.name)}</button><button class="chip ${rsAll?'on':''}" id="r2">كل شعب الصف</button></div>
    <div class="note">🏆 العشرة الأوائل بعلامة مميزة، ولكل تلميذ نسبته المئوية، مرتبين من الأعلى تقييمًا إلى الأدنى حسب ⭐ التقييمات.</div>
    ${any?'':'<p class="note">لم تُدخل تقييمات بعد، أضف المواد والتقييمات من زر ⭐ التقييمات.</p>'}

$('#su').onclick=()=>run(()=>createUserWithEmailAndPassword(auth,$('#aem').value.trim(),$('#apw').value));
$('#fp').onclick=()=>run(async()=>{await sendPasswordResetEmail(auth,$('#aem').value.trim());msg('أُرسل رابط إعادة التعيين إلى بريدك')});
window.logout=()=>{try{localStorage.removeItem('reg_last_uid')}catch(e){}signOut(auth)};
onAuthStateChanged(auth,u=>{
  if(!u){try{localStorage.removeItem('reg_last_uid')}catch(e){}window.detach();$('#app').innerHTML='';$('#auth').classList.add('on');return}
  $('#auth').classList.remove('on');
  try{localStorage.setItem('reg_last_uid',u.uid)}catch(e){}
  const r=doc(fdb,'users',u.uid);
  window.attach(u.uid,{set:d=>setDoc(r,d),listen:(ok,bad)=>onSnapshot(r,{includeMetadataChanges:true},s=>ok(s.exists(),s.exists()?s.data().json:null,s.exists()?s.data().t:0,s.metadata.fromCache),bad)});
});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
